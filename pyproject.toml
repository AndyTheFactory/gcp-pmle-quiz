[project]
name = "quiz"
version = "0.1.0"
description = "Quiz Learner Streamlit app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.52.2",
  "pydantic>=2.12.5",
  "pyvis>=0.3.2",
  "pandas>=2.3.3",
  "diskcache>=5.6.3",
  "plotly>=6.5.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
